<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경사 고성혁 | 디지털 명함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECF1; --card:#FFFFFF; --navy:#13233F; --navy-ink:#FFFFFF;
  --gold:#A8843A; --text:#1B2230; --muted:#5B6577; --line:#D6DBE4; --chip:#F2F4F8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111C; --card:#141C2B; --navy:#0E1829; --navy-ink:#F3F5F9;
    --gold:#C9A55A; --text:#E7EAF0; --muted:#9AA5B8; --line:#26324A; --chip:#1B2538;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111C; --card:#141C2B; --navy:#0E1829; --navy-ink:#F3F5F9;
  --gold:#C9A55A; --text:#E7EAF0; --muted:#9AA5B8; --line:#26324A; --chip:#1B2538;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.6;display:flex;justify-content:center;padding:28px 16px 40px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(10,20,40,.12)}
.head{background:var(--navy);color:var(--navy-ink);padding:34px 28px 30px;position:relative;border-bottom:4px solid var(--gold)}
.badge{width:84px;height:auto;margin-bottom:20px;display:block}
.org{font-size:13px;letter-spacing:.04em;opacity:.8;margin:0 0 6px}
.name{font-family:"Noto Serif KR","Batang",serif;font-size:34px;font-weight:700;margin:0;letter-spacing:.06em;line-height:1.25}
.rank{font-size:15px;margin:8px 0 0;color:var(--gold);font-weight:500}
.body{padding:8px 28px 8px}
.row{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row:last-child{border-bottom:0}
.k{flex:0 0 64px;font-size:13px;color:var(--muted)}
.v{flex:1;font-size:15px;word-break:keep-all}
.v a{color:inherit;text-decoration:none;border-bottom:1px solid var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 28px 24px}
.btn{font:inherit;font-size:15px;font-weight:500;padding:13px 10px;border-radius:4px;cursor:pointer;
  text-align:center;text-decoration:none;border:1px solid var(--navy);background:var(--navy);color:var(--navy-ink)}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.wide{grid-column:1/-1}
.motto{margin:0;padding:18px 28px;background:var(--chip);text-align:center;font-family:"Noto Serif KR",serif;
  font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.motto b{color:var(--text);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:4px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
